<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-title" content="Lafla">
<meta name="application-name" content="Lafla">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<title>Lafla</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fffaf0,#14181d);--card:light-dark(#fff,#1f252d);--ink:light-dark(#1d2530,#eef1f4);--mut:light-dark(#6b7480,#9aa4ae);--pri:#1f3a5f;--hon:#f5c542;--ok:#2e8b57;--bad:#c8402f;--line:light-dark(#ece4d2,#2c333c)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
header select,header button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:8px 10px}
.stat{font-size:14px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.top{background:var(--hon);color:#1d2530;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.body{padding:20px 16px;text-align:center}
.tr{font-size:22px;margin:0 0 12px}
.en{font-size:26px;font-weight:700;color:#5d7a3a;margin:0 0 16px;letter-spacing:.3px}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid currentColor}
.mic{width:84px;height:84px;border-radius:50%;border:4px solid var(--pri);background:var(--card);color:var(--pri);font-size:15px;font-weight:700;cursor:pointer}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:1.5em;margin:14px 0 4px;color:var(--mut)}
.res{font-size:20px;font-weight:700;min-height:1.5em}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ans{margin-top:8px;font-size:18px}
.w-miss{color:var(--bad);text-decoration:underline}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-size:16px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=text]{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:12px}
.units{display:grid;gap:10px}
.unit{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;width:100%}
.unit small{color:var(--mut)}
.note{color:var(--mut);font-size:14px}
:focus-visible{outline:3px solid var(--hon);outline-offset:2px}
.brand{font-family:"Baloo 2",system-ui,sans-serif}
header h1 button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:8px}
/* ---- GİRİŞ EKRANI ---- */
body.intro header,body.intro main{display:none}
.welcome{display:none}
body.intro .welcome{display:flex}
.welcome{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;background:#1f3a5f;color:#fffaf0;align-items:center;justify-content:center;padding:40px 20px calc(40px + env(safe-area-inset-bottom))}
.w-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.w-in{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.w-logo{width:148px;height:148px;border-radius:36px;box-shadow:0 18px 40px rgba(6,16,30,.45),0 0 0 6px rgba(255,250,240,.08);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.w-name{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:68px;line-height:1;margin:26px 0 6px;letter-spacing:-.5px;animation:up .6s .15s both}
.w-tag{font-size:19px;margin:0;color:#d9e2ec;animation:up .6s .25s both}
.w-tag b{color:#f5c542}
.w-who-l{margin:40px 0 12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#aebccb;animation:up .6s .35s both}
.w-who{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;animation:up .6s .4s both}
.chip{font:inherit;font-size:17px;font-weight:600;min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid rgba(255,250,240,.35);background:transparent;color:#fffaf0;cursor:pointer}
.chip[aria-pressed=true]{background:#fffaf0;border-color:#fffaf0;color:#1f3a5f}
.chip.add{border-style:dashed;color:#d9e2ec}
.w-add{display:flex;gap:8px;width:100%;max-width:320px}
.w-add input{margin:0;background:#fffaf0;color:#1d2530;border:0}
.w-go{margin-top:36px;width:100%;max-width:320px;min-height:60px;border:0;border-radius:18px;background:#f5c542;color:#1f3a5f;font:inherit;font-family:"Baloo 2",system-ui,sans-serif;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 8px 0 #c99a16;transition:transform .1s,box-shadow .1s;animation:up .6s .5s both}
.w-go:active{transform:translateY(6px);box-shadow:0 2px 0 #c99a16}
.w-stat{margin:18px 0 0;font-size:15px;color:#aebccb;min-height:1.5em}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.w-logo,.w-name,.w-tag,.w-who-l,.w-who,.w-go{animation:none}}
/* ---- ÜNİTE KARTLARI ---- */
.hello{font-family:"Baloo 2",system-ui,sans-serif;font-size:30px;font-weight:800;color:var(--ink);margin:8px 0 2px}
.units{gap:14px}
.unit{gap:16px;padding:16px;border-radius:20px;justify-content:flex-start;transition:transform .12s}
.unit:active{transform:scale(.98)}
.u-ic{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center}
.u-tx{flex:1;display:flex;flex-direction:column;gap:6px}
.u-tx b{font-size:19px}
.u-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.u-bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
@media(prefers-color-scheme:dark){.u-bar i{background:var(--hon)}}
.u-go{flex:none;color:var(--mut);font-size:22px}
.unit.rev{background:#fff4d6;border-color:#f5c542;color:#1d2530}
.unit.rev small{color:#5b4a12}
.u-head{display:flex;align-items:center;gap:14px;margin:18px 0 14px}
.lv{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:13px;letter-spacing:2px;color:#1f3a5f;background:#e8eef5}
.lv-b{background:#fde9a9}.lv-c{background:#f7d4cc}
.lb{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px 6px}
.lb h2{font-family:"Baloo 2",system-ui,sans-serif;font-size:22px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.lb h2 small{font-family:system-ui,sans-serif;font-size:13px;font-weight:400;color:var(--mut)}
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb li.me{background:light-dark(#fff8e6,#2a2f22);border-radius:12px}
.lb-r{width:32px;text-align:center;font-size:20px;font-weight:700}
.lb-n{flex:1;font-weight:600}
.lb-s{text-align:right;font-weight:700;display:flex;flex-direction:column}
.lb-s small{font-weight:400;font-size:13px;color:var(--mut)}
header .stat{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.goal{display:flex;align-items:center;gap:14px;width:100%;margin:4px 0 14px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.goal small{color:var(--mut)}
.goal-row{display:flex;align-items:center;gap:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 4px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column}
.stats b{font-size:24px}.stats small{color:var(--mut)}
.lb + .lb{margin-top:14px}
.tog{display:flex;gap:12px;align-items:flex-start;padding:4px 0 14px;cursor:pointer}
.tog input{width:22px;height:22px;margin-top:3px;accent-color:#1f3a5f;flex:none}
.tog small{color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding-bottom:14px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px;background:light-dark(#fffaf0,#1a1f26)}
.badge span{font-size:32px}.badge small{color:var(--mut);font-size:12px;line-height:1.3}
.badge.off{opacity:.45;filter:grayscale(1)}
.en.full{color:var(--pri)}
@media(prefers-color-scheme:dark){.en.full{color:#f5c542}}
button.w-miss{font:inherit;background:none;border:0;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer}
.clar{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;margin:2px 0 6px}
.clar-bar{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.clar-bar i{display:block;height:100%}
.clar-ok i{background:var(--ok)}.clar-mid i{background:#f5c542}.clar-low i{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);background:#1f3a5f;color:#fffaf0;padding:12px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s;z-index:9;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast:not(.on){visibility:hidden;transition:transform .3s,visibility 0s .3s}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

</section>
<header>

<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

  p.done=p.done||{}; p.streak=p.streak||0; p.last=p.last||""; p.total=p.total||0; p.rev=p.rev||{}; p.days=p.days||{};

// ---- KARŞILAŞTIRMA ----
function check(said, target){
  const a = norm(said).split(" "), t = norm(target).split(" ");
  // kelime bazlı LCS
  const m=a.length,n=t.length,L=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===t[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Set();let i=0,j=0;
  while(i<m&&j<n){if(a[i]===t[j]){hit.add(j);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const score = hit.size / n;
  // ekranda orijinal kelimeleri göster ("didn't" gibi kelimeler iki parçaya açıldığı için parça sayısını takip et)
  let k=0;
  const html = target.split(" ").map(w=>{const c=norm(w).split(" ").filter(Boolean).length;let ok=true;for(let x=0;x<c;x++)if(!hit.has(k+x))ok=false;k+=c;return ok?esc(w):`<button type="button" class="w-miss" data-say="${esc(w.replace(/[^A-Za-z']/g,""))}" aria-label="${esc(w)} kelimesini dinle">${esc(w)}</button>`}).join(" ");
  return {score, html};
}

function lesson(list, title, back, isReview=false, startAt=0){
  let idx = startAt, rec = null, tries = 0, solved = false, nOk = 0, nRev = 0, stage = "main";
  const markWrong = key => {const p=prog();if(!p.rev[key]||p.rev[key].box>0||isReview){if(!p.rev[key])nRev++;p.rev[key]={box:0,due:day(1)};saveProg(p)}};
  const bindSay = () => document.querySelectorAll("#ans [data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  const clarity = c => {if(!(c>0))return "";const lv=c>=.85?["Çok net","ok"]:c>=.6?["Anlaşılır","mid"]:["Biraz daha net söyle","low"];
    return `<div class="clar clar-${lv[1]}"><span>Anlaşılırlık: <b>${lv[0]}</b></span><span class="clar-bar"><i style="width:${Math.round(c*100)}%"></i></span></div>`};
  const show = (stg) => {
    const it = list[idx]; tries=0; solved=false;
    stage = stg || ((!isReview && prog().rep && !prog().done[it.key]) ? "rep" : "main");
    const rep = stage==="rep";
    const shown = rep ? esc(it.en) : esc(it.en).replace(esc(it.b), `<span class="blank">&nbsp;</span>`);
    $("#app").innerHTML = `<div class="card">
      <div class="top"><span>${rep?"👂 Dinle ve tekrarla":(isReview?"🔁 ":"")+esc(title)}</span><span>${idx+1}/${list.length}</span></div>
      <div class="bar"><i style="width:${idx/list.length*100}%"></i></div>
      <div class="body">
        ${isReview?`<p class="note" style="margin:0 0 8px">${esc(it.u.name)} · ${esc(it.l.name)}</p>`:""}
        ${rep?`<p class="note" style="margin:0 0 8px">Önce cümlenin tamamını dinle ve aynen tekrar et.</p>`:""}
        <p class="tr">${esc(it.tr)}</p>
        <p class="en${rep?" full":""}">${shown}</p>
        ${SR?`<button class="mic" id="mic" aria-label="Konuş">KONUŞ</button>`:""}
        <input type="text" id="typed" placeholder="${SR?"…ya da buraya yaz":"İngilizcesini yaz"}" autocomplete="off" autocapitalize="off">
        <p class="heard" id="heard"></p>
        <p class="res" id="res" aria-live="polite"></p>
        <div id="clar"></div>
        <div class="ans" id="ans"></div>
        <div class="row">
          <button class="btn" id="back">← Geri</button>
          ${rep?"":`<button class="btn" id="hint">İpucu</button>`}
          <button class="btn" id="listen">🔊 Dinle</button>
          <button class="btn pri" id="next">${rep?"Atla →":"Geç →"}</button>
        </div>
      </div></div>`;
    $("#back").onclick = () => {stop();back()};
    if(!rep) $("#hint").onclick = () => {$("#ans").innerHTML = `İpucu: <b>${esc(it.b)}</b>`};
    $("#listen").onclick = () => say(it.en);
    $("#next").onclick = () => {stop();if(rep)return show("main");if(!solved)markWrong(it.key);next()};
    $("#typed").onkeydown = e => {if(e.key==="Enter"&&e.target.value.trim())grade(e.target.value)};
    if(SR) $("#mic").onclick = () => rec ? stop() : start();
    if(rep) setTimeout(()=>say(it.en),250);
  };
  const grade = (said, conf=0) => {
    if(solved) return;
    const it = list[idx];
    $("#heard").textContent = "Duyulan: “" + said + "”";
    $("#clar").innerHTML = clarity(conf);
    const r = check(said, it.en);
    tries++;
    if(stage==="rep"){
      if(r.score >= .85){
        solved = true;
        $("#res").className="res ok";$("#res").textContent="Güzel! Şimdi boşluklu haliyle söyle.";
        $("#ans").innerHTML = r.score<1 ? r.html : ""; bindSay();
        setTimeout(()=>{if(stage==="rep"&&list[idx]===it)show("main")},1400);
      } else {
        $("#res").className="res bad";$("#res").textContent="Tekrar dene. Kırmızı kelimelere dokunup dinle:";
        $("#ans").innerHTML = r.html; bindSay();
      }
      return;
    }
    if(r.score >= .85){
      solved = true; nOk++;
      const gained = 10 + (tries===1?5:0);
      $("#res").className="res ok";$("#res").textContent = (r.score===1?"Harika! 🎉":"Çok iyi! 👍") + `  +${gained} ⭐`;
      $("#ans").innerHTML = r.score<1 ? r.html + `<p class="note">Kırmızı kelimeye dokunup dinleyebilirsin.</p>` : esc(it.en); bindSay();
      $("#next").textContent="Devam →";
      const p=prog(), t=day(), before=p.days[t]||0;
      if(!p.done[it.key]){p.done[it.key]=1;p.total++}
      p.pts += gained; p.words += norm(it.en).split(" ").length;
      p.days[t]=before+1;
      if(before<p.goal && before+1>=p.goal){p.goalDays++;toast("🎯 Günlük hedef tamam!")}
      if(p.last!==t){p.streak = p.last===day(-1) ? p.streak+1 : 1; p.last=t}
      p.best=Math.max(p.best,p.streak);
      if(isReview && tries===1 && p.rev[it.key]){
        p.revOk++;
        const box=p.rev[it.key].box+1;
        if(box>=INTERVAL.length) delete p.rev[it.key]; else p.rev[it.key]={box,due:day(INTERVAL[box])};
      }
      award(p).forEach(b=>toast(`🏅 Yeni rozet: ${b.ic} ${b.name}`));
      saveProg(p);renderHeader();say(it.en);
    } else {
      if(tries===1) markWrong(it.key);
      $("#res").className="res bad";$("#res").textContent = tries>=2?"Doğrusu şu, bir daha dene:":"Tekrar dene";
      $("#ans").innerHTML = tries>=2 ? r.html + `<p class="note">Kırmızı kelimeye dokunup dinle.</p>` : ""; bindSay();
    }
  };
  const start = () => {
    rec = new SR(); rec.lang="en-US"; rec.interimResults=true; rec.maxAlternatives=3;
    $("#mic").classList.add("on"); $("#mic").textContent="DİNLİYOR"; $("#res").textContent="";
    let finalText="", lastText="", gotAudio=false, conf=0;
    const status = t => {const h=$("#heard");if(h)h.textContent=t};
    rec.onstart = () => status("🎙️ Başladı, konuş…");
    rec.onaudiostart = () => {gotAudio=true;status("🎙️ Ses alınıyor…")};
    rec.onspeechstart = () => status("🗣️ Konuşma algılandı…");
    // 7 sn sonra otomatik durdur (bazı telefonlar kendiliğinden durmuyor)
    const timer = setTimeout(()=>stop(),7000);
    rec.onresult = e => {
      const r=e.results[e.results.length-1];
      lastText = r[0].transcript;
      $("#heard").textContent = "… " + r[0].transcript;
      if(r.isFinal){
        // alternatifler arasından en iyisini seç
        const it=list[idx];let best=r[0].transcript,bs=-1;
        for(let k=0;k<r.length;k++){const s=check(r[k].transcript,it.en).score;if(s>bs){bs=s;best=r[k].transcript;conf=r[k].confidence||0}}
        finalText=best;
      }
    };
    let err="";
    rec.onerror = e => {err=e.error;const m=$("#mic");if(m){m.classList.remove("on");m.textContent="KONUŞ"}status({
      "not-allowed":"⛔ Mikrofon izni yok. Tarayıcı ayarlarından bu siteye mikrofon izni ver.",
      "service-not-allowed":"⛔ Ses tanıma bu tarayıcıda kapalı. Android: Chrome, iPhone: Safari ile aç.",
      "no-speech":"Ses duyulmadı, tekrar dene (telefona yakın konuş).",
      "audio-capture":"⛔ Mikrofon bulunamadı veya başka uygulama kullanıyor.",
      "network":"⛔ Ses tanıma internet istiyor, bağlantını kontrol et."
    }[e.error]||("Hata: "+e.error))};
    rec.onend = () => {
      clearTimeout(timer);
      const m=$("#mic");if(m){m.classList.remove("on");m.textContent="KONUŞ"}rec=null;
      const t = finalText || lastText;   // iPhone'da sonuç bazen "final" işaretlenmiyor
      if(t) grade(t, finalText?conf:0);
      else if(!err) status(gotAudio?"Ses geldi ama kelime anlaşılamadı, tekrar dene.":"⛔ Mikrofondan ses gelmedi. Sayfayı Chrome/Safari'de, https adresinden açtığından emin ol.");
    };
    try{rec.start()}catch(x){clearTimeout(timer);status("⛔ Başlatılamadı: "+x.message);stop()}
  };
  const stop = () => {try{rec&&rec.stop()}catch{}};
  const next = () => {idx++;if(idx>=list.length){
      $("#app").innerHTML=`<div class="card"><div class="body"><p class="tr">🎉 ${isReview?"Tekrar":"“"+esc(title)+"”"} bitti!</p>
      <p>${nOk} cümleyi doğru söyledin.${nRev?` ${nRev} cümle birkaç gün sonra tekrar sorulacak.`:""}</p>
      <div class="row"><button class="btn pri" id="h">Devam</button></div></div></div>`;$("#h").onclick=back;
    } else show()};
  show();
}

// ---- GİRİŞ EKRANI ----
function welcome(){
  document.body.classList.add("intro");
  const box=$("#wWho");
  box.innerHTML = users.map(u=>`<button type="button" class="chip" aria-pressed="${u===cur}" data-u="${esc(u)}">${esc(u)}</button>`).join("")
    + `<button type="button" class="chip add" id="wAdd">+ Kişi ekle</button>`;
  box.querySelectorAll(".chip[data-u]").forEach(b=>b.onclick=()=>{cur=b.dataset.u;store.set("as_cur",cur);welcome()});
  $("#wAdd").onclick=()=>{
    box.innerHTML=`<div class="w-add"><input type="text" id="wNew" maxlength="20" placeholder="Adı" aria-label="Yeni kişinin adı"><button type="button" class="btn pri" id="wOk">Ekle</button></div>`;
    const inp=$("#wNew"); inp.focus();
    const ok=()=>{const n=inp.value.trim();if(n&&!users.includes(n)){users.push(n);store.set("as_users",users)}if(n){cur=n;store.set("as_cur",cur)}welcome()};
    $("#wOk").onclick=ok; inp.onkeydown=e=>{if(e.key==="Enter")ok();if(e.key==="Escape")welcome()};
  };
  const p=prog();
  const td=p.days[day()]||0, left=p.goal-td;
  $("#wStat").textContent = !p.total ? `Merhaba ${cur}, ilk cümlen seni bekliyor.`
    : left<=0 ? `🎯 Bugünkü hedef tamam · 🔥 ${streakOf(p)} gün · ⭐ ${p.pts}`
    : td===0 ? `🔔 Bugün henüz pratik yapmadın. Hedef: ${p.goal} cümle${streakOf(p)?` · 🔥 ${streakOf(p)} günlük serini koru!`:""}`
    : `Bugün ${td}/${p.goal} cümle · hedefe ${left} kaldı · ⭐ ${p.pts}`;
}
$("#wGo").onclick=()=>{document.body.classList.remove("intro");renderHeader();home();window.scrollTo(0,0)};
$("#toWelcome").onclick=()=>{try{speechSynthesis.cancel()}catch{}welcome()};

renderHeader();welcome();
}
</script>
